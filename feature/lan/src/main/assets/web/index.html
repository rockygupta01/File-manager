<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi File Transfer Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h2 class="app-title">File Manager</h2>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-path="/">
                    <span class="material-symbols-outlined">folder</span>
                    My files
                </a>
                <a href="#" class="nav-item" data-path="/recent" data-special="recent">
                    <span class="material-symbols-outlined">schedule</span>
                    Recent files
                </a>
                <a href="#" class="nav-item" data-special="pictures">
                    <span class="material-symbols-outlined">image</span>
                    Pictures
                </a>
                <a href="#" class="nav-item" data-special="videos">
                    <span class="material-symbols-outlined">movie</span>
                    Videos
                </a>
                <a href="#" class="nav-item" data-special="musics">
                    <span class="material-symbols-outlined">music_note</span>
                    Musics
                </a>
                <a href="#" class="nav-item" data-special="documents">
                    <span class="material-symbols-outlined">article</span>
                    Documents
                </a>
                <a href="#" class="nav-item" data-special="search">
                    <span class="material-symbols-outlined">search</span>
                    Search
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumb" id="breadcrumb">
                    <!-- Dynamic Breadcrumb -->
                </div>
                <div class="search-container hidden" id="search-container">
                    <span class="material-symbols-outlined search-icon">search</span>
                    <input type="text" id="search-input" class="search-input" placeholder="Search files...">
                </div>
                <div class="actions">
                    <button class="icon-btn" id="refreshBtn" title="Refresh">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                    <!-- <button class="icon-btn" title="Upload">
                        <span class="material-symbols-outlined">upload</span>
                    </button> -->
                </div>
            </header>

            <div class="content-scroll">
                <div id="loader" class="loader-container">
                    <div class="spinner"></div>
                </div>

                <div id="error-message" class="error-container hidden">
                    <span class="material-symbols-outlined error-icon">error</span>
                    <p id="error-text">Failed to load content.</p>
                </div>

                <div id="file-grid" class="file-grid hidden">
                    <!-- Dynamic File Cards will be generated here -->
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
